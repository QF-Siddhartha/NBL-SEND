<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} · {{ app_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="{{ url_for('home') }}"><span class="logo">🛠️</span>{{ app_name }}</a>
    <nav class="site-nav">
      <a href="{{ url_for('home') }}" class="{{ 'active' if request.endpoint == 'home' }}">Home</a>
      <a href="{{ url_for('solutions') }}" class="{{ 'active' if request.endpoint == 'solutions' }}">Solutions</a>
      <a href="{{ url_for('track') }}" class="{{ 'active' if request.endpoint == 'track' }}">Track ticket</a>
      <a href="{{ url_for('report') }}" class="cta">+ Report problem</a>
    </nav>
  </div>
</header>
<main class="container">
  {% include "_flashes.html" %}
  {% block content %}{% endblock %}
</main>
<footer class="site-footer">{{ app_name }} · Internal use only · <a href="{{ url_for('admin_login') }}">IT staff login</a></footer>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
