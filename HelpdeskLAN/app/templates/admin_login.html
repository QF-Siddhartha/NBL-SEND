<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin sign in · {{ app_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="login-page">
  <form class="login-card" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ next_url }}">
    <div class="logo">🔒</div>
    <h1 class="center">Helpdesk Admin</h1>
    <p class="sub center">Sign in to manage support tickets</p>
    {% include "_flashes.html" %}
    {% if no_admin %}<div class="login-note">No admin account exists yet. On the server, run <b>scripts\create_admin.bat</b> first.</div>{% endif %}
    {% if error %}<div class="login-error">{{ error }}</div>{% endif %}
    <div class="field"><label for="username">Username</label>
      <input id="username" name="username" value="{{ username }}" autocomplete="username" required autofocus></div>
    <div class="field"><label for="password">Password</label>
      <input id="password" type="password" name="password" autocomplete="current-password" required></div>
    <button class="btn block">Sign in</button>
    <p class="hint center mt"><a href="{{ url_for('home') }}">← Back to employee portal</a></p>
  </form>
</div>
</body>
</html>
